[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# no global solc pin: each file picks by pragma (Uniswap core =0.5.16, periphery =0.6.6, ours ^0.8)
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
# cosmos/evm v0.7.3 enables up to Prague (Osaka not yet) -> don't emit newer opcodes.
# Older solc versions are clamped to the newest EVM version they support.
evm_version = "prague"
# tests read vendored sources to check the init code hash patch
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "./src" }, { access = "read-write", path = "../deployments" }]

[rpc_endpoints]
potato_local = "http://localhost:8545"
