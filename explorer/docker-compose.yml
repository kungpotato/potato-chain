# Blockscout for potato-chain (minimal: no stats/visualizer/verifier microservices).
# Start the localnet first (it owns the potato-net network). See docs/05-explorer-faucet.png.
#   make explorer-up   -> http://localhost
name: potato-explorer

services:
  db:
    image: postgres:17
    restart: unless-stopped
    shm_size: 256m
    command: postgres -c max_connections=100
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make explorer-up to generate explorer/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    image: ghcr.io/blockscout/blockscout:9.0.2
    restart: unless-stopped
    stop_grace_period: 1m
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: sh -c 'bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start'
    env_file: backend.env
    environment:
      DATABASE_URL: postgresql://blockscout:${POSTGRES_PASSWORD}@db:5432/blockscout
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?run make explorer-up to generate explorer/.env}
    networks: [default, potato-net]

  frontend:
    image: ghcr.io/blockscout/frontend:v2.3.5
    restart: unless-stopped
    depends_on: [backend]
    env_file: frontend.env

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [backend, frontend]
    volumes:
      - ./proxy:/etc/nginx/conf.d:ro
    ports:
      - "80:80"

volumes:
  db-data:

networks:
  potato-net:
    external: true
